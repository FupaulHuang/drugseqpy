[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "drugseqpy"
version = "0.2.0"
description = "Quality control and analysis of DRUG-seq / HTTr high-throughput transcriptomics data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DRUGseqPy authors" }]

dependencies = [
    # Core data structures
    "anndata>=0.10",
    "scanpy>=1.10",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.12",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",

    # Normalization / DE
    "pydeseq2>=0.4",
    "statsmodels>=0.14",

    # Dimensionality reduction
    "scikit-learn>=1.4",
    "umap-learn>=0.5",

    # Batch correction
    "harmonypy>=0.0.9",

    # Enrichment
    "gseapy>=1.1",

    # Dose-response
    "lmfit>=1.3",

    # Utilities
    "tqdm>=4.66",
    "joblib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
full = [
    "inmoose>=0.2",          # pycombat batch correction
    "decoupler>=1.6",        # pathway activity inference
    "chembl-webresource-client>=0.10",
    "rdkit>=2023.9",
    "jupyter>=1.0",
    "ipywidgets>=8.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["drugseqpy*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
